<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Exam Simulation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="topbar">
        <h2><a href="" onclick="location.reload(); return false;" style="color: inherit; text-decoration: none; cursor: pointer;">Online Exam Simulation</a></h2>
        <nav class="qs-links">
            <a href="#" onclick="quickstart('math'); return false;">Math</a>
            <a href="#" onclick="quickstart('phy'); return false;">Physics</a>
            <a href="#" onclick="quickstart('chem'); return false;">Chemistry</a>
        </nav>
        <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" style="background:none;border:1px solid currentColor;color:inherit;padding:4px 8px;border-radius:6px;cursor:pointer;">Theme</button>
        <div id="progress-indicator" aria-live="polite">0 of 0 answered</div>
        <div id="time-remaining">Time left: </div>
        <div id="timer">00:00</div>
    </div>

    <div class="container">
        <div id="popup">
            <form id="choice" action="#">
                <h2 id="top">Subject</h2>
                <select name="subject" id="subject" form="choice">
                    <option value="math">Mathematics</option>
                    <option value="phy">Physics</option>
                    <option value="chem">Chemistry</option>
                </select>
                <h2>Time</h2>
                <input type="number" id="time" placeholder="Enter time in minutes">
                <button type="button" id="submit" onclick="init()">Start</button>
            </form>
        </div>
        <div class="main">
            <h3 id="question"></h3>
            <img id="img">
            <div id="img-br"></div>
            <div id="options"></div>
            <div id="buttons">
                <button id="prev-btn" onclick="prev()">Previous</button>
                <button id="next-btn" onclick="next()">Next</button>
                <button id="submit-btn" onclick="submit()">Submit Exam</button>
                <button id="mark-btn" onclick="mark()">Mark</button>
            </div>
        </div>

        <div class="sidebar" id="question-nav"></div>
    </div>

    <div id="overlay"></div>

    <div id="focus-warning">Tab switch detected!</div>

    <div id="warning-toast">Less than 1 minute remaining!</div>

    <div id="end-popup">
        <h2 id="end-popup-title">Exam Complete</h2>
        <div id="end-score-wrap">
            <span id="end-score-label">Your Score</span>
            <div id="end-score"></div>
        </div>
        <div id="results-table-wrap">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Question</th>
                        <th>Your Answer</th>
                        <th>Correct Answer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
        <button id="restart-btn" onclick="restart()">Restart</button>
    </div>

    <footer id="foot">
        <p><a href="https://github.com/Speedbird849/exam-interface" target="_blank" id="footer-link">&copy; 2026, Designed by Aryan Gupta. All rights reserved.</a></p>
    </footer>

    <script src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>
</body>
</html>
